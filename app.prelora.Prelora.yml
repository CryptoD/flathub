id: app.prelora.Prelora
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: prelora-desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: prelora-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/prelora-desktop /app/bin/prelora-desktop
      - cp -a usr/share /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://prelora.app/downloads/v0.1.53/prelora-desktop-v0.1.53-x86_64.tar.gz
        sha256: "1e1ee0897ea054f11ca7f94e40742ddc83bdd193c5b67534f70f86bd7f71fa10"
        strip-components: 0
      - type: archive
        only-arches:
          - aarch64
        url: https://prelora.app/downloads/v0.1.53/prelora-desktop-v0.1.53-aarch64.tar.gz
        sha256: "fe8445f59eaedbfcd91de5bf1dfd8fccdce50bae2b264b10aa43d7e309347245"
        strip-components: 0